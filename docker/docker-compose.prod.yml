# Production (docs/deployment.md §7): the VPS at /srv/distinctive, next to Caddyfile and .env.
#
#   docker compose -f docker-compose.prod.yml pull web
#   docker compose -f docker-compose.prod.yml up -d --remove-orphans
#
# Locally (Day 9, the prod stack at https://localhost), from the repo root, with an image you
# built yourself (docs/commands/Phase_1/day-9.md):
#   docker compose --env-file .env.prod -f docker/docker-compose.prod.yml up -d
# where .env.prod sets ENV_FILE=../.env.prod (paths here are relative to this file's folder).
services:
  web:
    image: ghcr.io/${GHCR_IMAGE:?set GHCR_IMAGE (owner/repo, lower case)}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    volumes:
      - media_data:/app/media
    depends_on:
      db: { condition: service_healthy }
    expose: ["8000"]

  db:
    image: postgres:16
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media_data:/srv/media:ro
      - caddy_data:/data # the certificates: never delete this volume
      - caddy_config:/config
    depends_on: [web]

volumes:
  pg_data:
  media_data:
  caddy_data:
  caddy_config:
