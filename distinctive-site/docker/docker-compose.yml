# Local development. Always:  docker compose -f docker/docker-compose.yml up --build
# The source is bind-mounted over /app; the Python packages live in the image.
name: distinctive

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS: dev.txt
    command: python manage.py runserver 0.0.0.0:8000
    env_file: ../.env
    volumes:
      - ..:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  db:
    image: postgres:16
    env_file: ../.env
    volumes:
      - pg_data:/var/lib/postgresql/data   # survives `down`; only `down -v` deletes it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

volumes:
  pg_data:
  media_data:
