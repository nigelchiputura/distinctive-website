{% load static %}
{# White navbar. Items from NavigationService (apps/core/services/navigation_service.py). #}
<nav class="navbar navbar-expand-lg navbar-light site-navbar sticky-top" aria-label="Main">
  <div class="container">
    <a class="navbar-brand" href="/">
      <img src="{% static 'img/logo.png' %}" alt="{{ site_info.company_name }} home" width="172" height="100">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"
            aria-controls="main-nav" aria-expanded="false" aria-label="Show the menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="main-nav">
      <ul class="navbar-nav ms-auto">
        {% for item in nav_items %}
          <li class="nav-item">
            <a class="nav-link{% if item.active %} active{% endif %}" href="{{ item.url }}"{% if item.active %} aria-current="page"{% endif %}>{{ item.label }}</a>
          </li>
        {% endfor %}
        {# Phase 2 adds the search icon here. #}
      </ul>
    </div>
  </div>
</nav>
